# Default workflow: construct a BPE tokenizer on PubChem10M.
# Select all three groups explicitly when switching pipeline stages.
defaults:
  - experiment: tokenizer_training
  - dataset: pubchem10m_tokenizer_train
  - algorithm: train_bpe
  - cluster: null
  - _self_

debug: false

wandb:
  entity: ncduy0303 # Override with your own account for online logging.
  project: molecule-tokenization
  mode: disabled # Set online or offline for Hugging Face Trainer logging.

# Local full Hugging Face Trainer checkpoint (checkpoint-N), not a W&B run ID.
resume: null
# Retained only to give an actionable error for obsolete commands.
load: null
